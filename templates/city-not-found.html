<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>City not found | weather</title>
    <link href="{{ url_for('static', filename='style/style.css') }}" rel="stylesheet" />
</head>

<body>
    <main class="page-shell">
        <header class="topbar">
            <a class="brand" href="/" aria-label="Weather home">
                <span class="brand-mark" aria-hidden="true">W</span>
                <span>weather<span class="brand-dot">.</span></span>
            </a>
            <a class="back-link" href="/">&#8592; <span>Home</span></a>
        </header>

        <section class="not-found-layout" aria-labelledby="not-found-title">
            <div>
                <p class="eyebrow"><span class="eyebrow-line"></span> LET'S TRY THAT AGAIN</p>
                <h1 id="not-found-title">We can't find<br />that city<span class="heading-dot">.</span></h1>
                <p class="intro">{{ 'No weather found for "' ~ query ~ '". Check the spelling or try another city.' if query else 'Enter a city to see what the weather is like there.' }}</p>
                <form class="search-form" action="/weather" method="get">
                    <label for="city">Search for a city</label>
                    <div class="search-control">
                        <span class="location-icon" aria-hidden="true">⌖</span>
                        <input type="text" name="city" id="city" placeholder="e.g. Lisbon, Tokyo, Nairobi" required minlength="2" autocomplete="address-level2" autofocus />
                        <button type="submit" aria-label="Search weather">
                            <span>Try again</span>
                            <span aria-hidden="true">&#8594;</span>
                        </button>
                    </div>
                </form>
            </div>
            <div class="not-found-stamp" aria-hidden="true"><span>?</span><small>NO CITY<br />FOUND</small></div>
        </section>

        <footer class="page-footer">
            <span>Weather for wherever life takes you.</span>
            <span class="footer-mark">KEEP EXPLORING <span aria-hidden="true">&#8599;</span></span>
        </footer>
    </main>
</body>

</html>
